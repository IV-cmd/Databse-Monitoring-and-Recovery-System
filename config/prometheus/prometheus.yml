global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 10s
    metrics_path: /metrics

  - job_name: 'postgres-primary'
    static_configs:
      - targets: ['postgres-primary:5432']
    scrape_interval: 10s
    metrics_path: /metrics

  - job_name: 'postgres-replica'
    static_configs:
      - targets: ['postgres-replica:5432']
    scrape_interval: 10s
    metrics_path: /metrics

  - job_name: 'monitor-service'
    static_configs:
      - targets: ['monitor-service:8000']
    scrape_interval: 15s
    metrics_path: /metrics
